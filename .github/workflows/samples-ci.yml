# .github/workflows/samples-ci.yml — build + run every sample's .e2e.yaml suite, plus the
# migrations/ worked examples
#
# Triggers: push and pull_request to main, plus manual dispatch. Docs-only
# changes (Markdown anywhere, docs/, site/, LICENSE, .gitignore) skip the
# whole workflow via paths-ignore (issue #12): the 5-runner Docker matrix
# costs runner-minutes on every push and proves nothing about prose. The
# branch ruleset names no required checks, so a skipped run does not wedge
# merges. Anything that can affect a suite run — samples/, migrations/,
# scripts/, ENGINE_PIN, global.json, this workflow — still triggers, and
# workflow_dispatch remains available to force a full run on any ref.
#
# Each sample gets its own matrix job (separate runners, so no DCP/port
# contention between them) that:
#   1. checks out this repo,
#   2. sets up the pinned .NET SDK (global.json),
#   3. bootstraps the pinned vouchfx engine commit and builds its CLI,
#   4. builds the sample's Docker image and runs its suite through the CLI,
#   5. uploads the JUnit/HTML reports as an artifact, win or lose.
#
# Within a single machine, scripts/run-sample.sh only ever runs one sample at a
# time (see docs/RUNNING.md) — Aspire/DCP topologies collide on shared
# resources when run concurrently. The matrix below sidesteps that by giving
# each sample its own isolated runner rather than by running them in parallel
# on one host.
#
# A separate 'migrations' job (own runner, same isolation reasoning) compile-checks the
# two migrations/*/source test projects (xUnit, SpecFlow — proving the "before" code is
# genuine, working C#, not a strawman) and runs all three migrations/*/ported suites
# through scripts/run-migrations.sh, which is itself sequential for the same DCP reason.

name: Samples CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "site/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "site/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_MULTILEVEL_LOOKUP: "0"

jobs:
  bash-runner:
    name: Bash sample runner regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout vouchfx-samples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test sample dispatch without Docker
        run: bash scripts/tests/test-run-sample.sh

  powershell-runner:
    name: PowerShell sample runner regressions
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout vouchfx-samples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test sample dispatch without Docker
        shell: pwsh
        run: ./scripts/tests/test-run-sample.ps1

  sample:
    name: ${{ matrix.sample }}${{ matrix.dotnet != '8.0' && format(' .NET {0}', matrix.dotnet) || '' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # Image pulls (Postgres/Kafka/etc.), Aspire/DCP startup (~20s per
    # resource), and the heavier samples' own dependencies (e.g. SQL Server)
    # make this slower than a typical unit-test job — 25 minutes leaves
    # comfortable headroom without masking a genuinely hung suite.
    timeout-minutes: 25

    strategy:
      fail-fast: false
      # Six matrix entries, six isolated runners — full fan-out is safe
      # (see the file header: the CI matrix, not this value, is what keeps
      # samples from colliding on shared Aspire/DCP resources).
      max-parallel: 6
      matrix:
        dotnet: ['8.0', '9.0', '10.0']
        sample:
          - orders-dotnet
          - inventory-python
          - payments-java
          - ledger-jsonrpc
          - kafka-mtls
          - orders-dotnet-compose

    steps:
      - name: Checkout vouchfx-samples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure isolated SDK and apphost roots
        run: |
          printf 'DOTNET_INSTALL_DIR=%s/dotnet-compatibility\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'DOTNET_ROOT_X64=%s/dotnet-compatibility\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Set up selected .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ matrix.dotnet }}.x

      - name: Test runtime-isolation guard safety
        shell: pwsh
        run: ./scripts/ci/test-select-dotnet-runtime.ps1
      - name: Keep only the selected SDK and shared frameworks
        env:
          EXPECTED_DOTNET: '${{ matrix.dotnet }}'
        shell: pwsh
        run: ./scripts/ci/select-dotnet-runtime.ps1 -ExpectedDotnet $env:EXPECTED_DOTNET
      - name: Require selected SDK, runtimes and Docker
        env:
          EXPECTED_DOTNET: ${{ matrix.dotnet }}
        run: |
          set -euo pipefail
          [[ "$(dotnet --version)" == "$EXPECTED_DOTNET".* ]]
          runtimes="$(dotnet --list-runtimes)"
          printf '%s\n' "$runtimes"
          [[ "$runtimes" == *Microsoft.NETCore.App* ]]
          [[ "$runtimes" == *Microsoft.AspNetCore.App* ]]
          while read -r _framework version _location; do
            [[ "$version" == "$EXPECTED_DOTNET".* ]]
          done <<< "$runtimes"
          test "$(docker info --format '{{.OSType}}')" = linux

      - name: Bootstrap engine CLI (pinned commit)
        run: bash scripts/bootstrap.sh

      - name: Run sample suite (${{ matrix.sample }})
        env:
          VOUCHFX_SAMPLE_DOTNET_VERSION: ${{ matrix.dotnet }}
        run: |
          VOUCHFX_COMPOSE_PASSWORD="$(openssl rand -hex 24)"
          export VOUCHFX_COMPOSE_PASSWORD
          echo "::add-mask::$VOUCHFX_COMPOSE_PASSWORD"
          bash scripts/run-sample.sh ${{ matrix.sample }}

      - name: Verify the .NET application image runtime
        if: matrix.sample == 'orders-dotnet' || matrix.sample == 'orders-dotnet-compose'
        env:
          EXPECTED_DOTNET: ${{ matrix.dotnet }}
          SAMPLE_NAME: ${{ matrix.sample }}
        run: |
          set -euo pipefail
          if [[ "$SAMPLE_NAME" == orders-dotnet ]]; then
            images=(vouchfx-samples-orders-dotnet:local)
          else
            mapfile -t images < <(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep -E '[-_]orders-api:' || true)
            test "${#images[@]}" -gt 0
          fi
          for image in "${images[@]}"; do
            runtimes="$(docker run --rm --entrypoint dotnet "$image" --list-runtimes)"
            printf '%s\n%s\n' "$image" "$runtimes"
            [[ "$runtimes" == *Microsoft.NETCore.App* ]]
            [[ "$runtimes" == *Microsoft.AspNetCore.App* ]]
            while read -r _framework version _location; do
              [[ "$version" == "$EXPECTED_DOTNET".* ]]
            done <<< "$runtimes"
          done

      # A suite that fails because a CONTAINER never became healthy leaves no
      # trace in this log: the engine reports "resource X failed to start" and
      # the container's own stdout — which says why — is never surfaced. That
      # cost a full debugging cycle on the kafka-mtls sample, where the broker
      # was measured healthy in 6.4s under `docker run` with identical inputs
      # and the orchestrated one never came up. Containers are usually torn
      # down by then; anything still present is worth reading.
      - name: Container diagnostics (${{ matrix.sample }})
        if: failure()
        run: |
          echo "=== containers (any state) ==="
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
          # Every command guarded, including the substitution. A container can
          # disappear between this list and the inspect below — DCP is tearing
          # them down while this step runs, which is why the step so often finds
          # nothing — and an unguarded failure there would abort the loop and
          # cost the logs of every container after it, in the one step whose
          # whole purpose is to salvage logs from a failure.
          for c in $(docker ps -aq 2>/dev/null || true); do
            name="$(docker inspect --format '{{.Name}}' "$c" 2>/dev/null || echo "$c")"
            echo "=== logs: ${name} ==="
            docker logs --tail 200 "$c" 2>&1 || true
          done

      - name: Upload reports (${{ matrix.sample }})
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ matrix.sample }}${{ matrix.dotnet != '8.0' && format('-net{0}', matrix.dotnet) || '' }}
          path: out/
          if-no-files-found: warn

  installed-sample:
    name: installed-${{ matrix.sample }}${{ matrix.dotnet != '8.0' && format(' .NET {0}', matrix.dotnet) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dotnet: ['8.0', '9.0', '10.0']
        sample:
          - orders-dotnet
          - inventory-python
          - payments-java
          - kafka-mtls
          - orders-dotnet-compose
    steps:
      - name: Checkout vouchfx-samples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure isolated SDK and apphost roots
        run: |
          printf 'DOTNET_INSTALL_DIR=%s/dotnet-compatibility\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'DOTNET_ROOT_X64=%s/dotnet-compatibility\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Set up selected .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ matrix.dotnet }}.x

      - name: Test runtime-isolation guard safety
        shell: pwsh
        run: ./scripts/ci/test-select-dotnet-runtime.ps1
      - name: Keep only the selected SDK and shared frameworks
        env:
          EXPECTED_DOTNET: '${{ matrix.dotnet }}'
        shell: pwsh
        run: ./scripts/ci/select-dotnet-runtime.ps1 -ExpectedDotnet $env:EXPECTED_DOTNET
      - name: Require selected SDK, runtimes and Docker
        env:
          EXPECTED_DOTNET: ${{ matrix.dotnet }}
        run: |
          set -euo pipefail
          [[ "$(dotnet --version)" == "$EXPECTED_DOTNET".* ]]
          runtimes="$(dotnet --list-runtimes)"
          printf '%s\n' "$runtimes"
          [[ "$runtimes" == *Microsoft.NETCore.App* ]]
          [[ "$runtimes" == *Microsoft.AspNetCore.App* ]]
          while read -r _framework version _location; do
            [[ "$version" == "$EXPECTED_DOTNET".* ]]
          done <<< "$runtimes"
          test "$(docker info --format '{{.OSType}}')" = linux
      - name: Install official Core CLI
        env:
          EXPECTED_DOTNET: ${{ matrix.dotnet }}
        run: |
          set -euo pipefail
          # Explicitly opt the unchanged public package into newer runtimes;
          # its original runtime policy is not rewritten.
          roll_forward=()
          if [[ "$EXPECTED_DOTNET" != 8.0 ]]; then
            roll_forward=(--allow-roll-forward)
          fi
          dotnet tool install vouchfx --version 1.2.0 --tool-path "$RUNNER_TEMP/official-cli" \
            --add-source https://api.nuget.org/v3/index.json "${roll_forward[@]}"
      - name: Run installed official sample
        env:
          VOUCHFX_SAMPLE_DOTNET_VERSION: ${{ matrix.dotnet }}
          VOUCHFX_SAMPLES_CLI_VERSION: 1.2.0+0af21de5bd0a4e91ca002e03e6c256bc4e8ca4e8
        run: |
          export VOUCHFX_SAMPLES_CLI="$RUNNER_TEMP/official-cli/vouchfx"
          VOUCHFX_COMPOSE_PASSWORD="$(openssl rand -hex 24)"
          export VOUCHFX_COMPOSE_PASSWORD
          echo "::add-mask::$VOUCHFX_COMPOSE_PASSWORD"
          bash scripts/run-sample.sh ${{ matrix.sample }}
      - name: Verify the .NET application image runtime
        if: matrix.sample == 'orders-dotnet' || matrix.sample == 'orders-dotnet-compose'
        env:
          EXPECTED_DOTNET: ${{ matrix.dotnet }}
          SAMPLE_NAME: ${{ matrix.sample }}
        run: |
          set -euo pipefail
          if [[ "$SAMPLE_NAME" == orders-dotnet ]]; then
            images=(vouchfx-samples-orders-dotnet:local)
          else
            mapfile -t images < <(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep -E '[-_]orders-api:' || true)
            test "${#images[@]}" -gt 0
          fi
          for image in "${images[@]}"; do
            runtimes="$(docker run --rm --entrypoint dotnet "$image" --list-runtimes)"
            printf '%s\n%s\n' "$image" "$runtimes"
            [[ "$runtimes" == *Microsoft.NETCore.App* ]]
            [[ "$runtimes" == *Microsoft.AspNetCore.App* ]]
            while read -r _framework version _location; do
              [[ "$version" == "$EXPECTED_DOTNET".* ]]
            done <<< "$runtimes"
          done

      - name: Upload installed reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-installed-${{ matrix.sample }}${{ matrix.dotnet != '8.0' && format('-net{0}', matrix.dotnet) || '' }}
          path: out/
          if-no-files-found: warn

  migrations:
    name: migrations${{ matrix.dotnet != '8.0' && format(' .NET {0}', matrix.dotnet) || '' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # More headroom than the sample matrix jobs: this is the heaviest job in the
    # workflow — the engine build plus two source-project compile checks plus THREE
    # sequential DCP topology suites (only the first pays the image pulls). Local
    # wall-clock is ~1.5 min for the suites alone; 30 minutes covers a cold CI runner
    # without masking a genuinely hung suite.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dotnet: ['8.0', '9.0', '10.0']

    steps:
      - name: Checkout vouchfx-samples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure isolated SDK and apphost roots
        run: |
          printf 'DOTNET_INSTALL_DIR=%s/dotnet-compatibility\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'DOTNET_ROOT_X64=%s/dotnet-compatibility\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Set up selected .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ matrix.dotnet }}.x

      - name: Test runtime-isolation guard safety
        shell: pwsh
        run: ./scripts/ci/test-select-dotnet-runtime.ps1
      - name: Keep only the selected SDK and shared frameworks
        env:
          EXPECTED_DOTNET: '${{ matrix.dotnet }}'
        shell: pwsh
        run: ./scripts/ci/select-dotnet-runtime.ps1 -ExpectedDotnet $env:EXPECTED_DOTNET
      - name: Require selected SDK, runtimes and Docker
        env:
          EXPECTED_DOTNET: ${{ matrix.dotnet }}
        run: |
          set -euo pipefail
          [[ "$(dotnet --version)" == "$EXPECTED_DOTNET".* ]]
          runtimes="$(dotnet --list-runtimes)"
          printf '%s\n' "$runtimes"
          [[ "$runtimes" == *Microsoft.NETCore.App* ]]
          [[ "$runtimes" == *Microsoft.AspNetCore.App* ]]
          while read -r _framework version _location; do
            [[ "$version" == "$EXPECTED_DOTNET".* ]]
          done <<< "$runtimes"
          test "$(docker info --format '{{.OSType}}')" = linux

      - name: Bootstrap engine CLI (pinned commit)
        run: bash scripts/bootstrap.sh

      # Compile-check the two "before" test projects being ported — proves the hand-rolled
      # source code in migrations/from-xunit and migrations/from-specflow is genuine,
      # working C#, not a strawman. Neither project is executed here: both require a live
      # stack this workflow does not stand up for them — see each migration's own README.
      - name: Compile-check migrations/from-xunit source
        run: dotnet build migrations/from-xunit/source/OrdersApi.IntegrationTests -c Release

      - name: Compile-check migrations/from-specflow source
        run: dotnet build migrations/from-specflow/source/Orders.Specs -c Release

      - name: Run migration suites (migrations/*/ported)
        env:
          VOUCHFX_SAMPLE_DOTNET_VERSION: ${{ matrix.dotnet }}
        run: bash scripts/run-migrations.sh

      - name: Verify the migration application's runtime image
        env:
          EXPECTED_DOTNET: ${{ matrix.dotnet }}
        run: |
          set -euo pipefail
          runtimes="$(docker run --rm --entrypoint dotnet vouchfx-samples-orders-dotnet:local --list-runtimes)"
          printf '%s\n' "$runtimes"
          [[ "$runtimes" == *Microsoft.NETCore.App* ]]
          [[ "$runtimes" == *Microsoft.AspNetCore.App* ]]
          while read -r _framework version _location; do
            [[ "$version" == "$EXPECTED_DOTNET".* ]]
          done <<< "$runtimes"

      - name: Upload reports (migrations)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-migrations${{ matrix.dotnet != '8.0' && format('-net{0}', matrix.dotnet) || '' }}
          path: out/
          if-no-files-found: warn
