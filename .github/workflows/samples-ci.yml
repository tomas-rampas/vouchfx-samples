# .github/workflows/samples-ci.yml — build + run every sample's .e2e.yaml suite, plus the
# migrations/ worked examples
#
# Triggers: push and pull_request to main, plus manual dispatch. Docs-only
# changes (Markdown anywhere, docs/, site/, LICENSE, .gitignore) skip the
# whole workflow via paths-ignore (issue #12): the 5-runner Docker matrix
# costs runner-minutes on every push and proves nothing about prose. The
# branch ruleset names no required checks, so a skipped run does not wedge
# merges. Anything that can affect a suite run — samples/, migrations/,
# scripts/, ENGINE_PIN, global.json, this workflow — still triggers, and
# workflow_dispatch remains available to force a full run on any ref.
#
# Each sample gets its own matrix job (separate runners, so no DCP/port
# contention between them) that:
#   1. checks out this repo,
#   2. sets up the pinned .NET SDK (global.json),
#   3. bootstraps the pinned vouchfx engine commit and builds its CLI,
#   4. builds the sample's Docker image and runs its suite through the CLI,
#   5. uploads the JUnit/HTML reports as an artifact, win or lose.
#
# Within a single machine, scripts/run-sample.sh only ever runs one sample at a
# time (see docs/RUNNING.md) — Aspire/DCP topologies collide on shared
# resources when run concurrently. The matrix below sidesteps that by giving
# each sample its own isolated runner rather than by running them in parallel
# on one host.
#
# A separate 'migrations' job (own runner, same isolation reasoning) compile-checks the
# two migrations/*/source test projects (xUnit, SpecFlow — proving the "before" code is
# genuine, working C#, not a strawman) and runs all three migrations/*/ported suites
# through scripts/run-migrations.sh, which is itself sequential for the same DCP reason.

name: Samples CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "site/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "site/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  sample:
    name: ${{ matrix.sample }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # Image pulls (Postgres/Kafka/etc.), Aspire/DCP startup (~20s per
    # resource), and the heavier samples' own dependencies (e.g. SQL Server)
    # make this slower than a typical unit-test job — 25 minutes leaves
    # comfortable headroom without masking a genuinely hung suite.
    timeout-minutes: 25

    strategy:
      fail-fast: false
      # Five matrix entries, five isolated runners — full fan-out is safe
      # (see the file header: the CI matrix, not this value, is what keeps
      # samples from colliding on shared Aspire/DCP resources).
      max-parallel: 5
      matrix:
        sample:
          - orders-dotnet
          - inventory-python
          - payments-java
          - ledger-jsonrpc
          - kafka-mtls

    steps:
      - name: Checkout vouchfx-samples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK (reads global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Bootstrap engine CLI (pinned commit)
        run: bash scripts/bootstrap.sh

      # DIAGNOSTIC SCAFFOLDING (temporary — kafka-mtls CI investigation, round 2).
      # Round 1 (commit 0e4c89d) proved docker (28.0.4) and podman (5.8.4) are
      # two genuinely separate installed runtimes here, but a 1s-interval
      # `podman ps -a | grep -i broker` poll NEVER once observed a "broker"
      # container — diag/watcher.log, broker-container.log and exec-diag.log
      # never got created, and a POST-run `podman ps -a`/`docker ps -a` were
      # both already empty too (not merely torn down between polls — the name
      # filter may have missed the real name, or the container's lifetime is
      # shorter than 1s). This round: (a) drops the name filter — capture
      # EVERY container, any runtime, unfiltered, (b) runs `podman events`/
      # `docker events` continuously from before the topology starts, so a
      # sub-second-lived container still leaves a create/start/die/remove
      # trail even if `ps -a` polling misses it, (c) captures DCP's own
      # working directory (the `/tmp/aspire-dcp*` path named in "Starting DCP
      # with arguments" in the existing job log) in case DCP writes its own
      # logs there, and (d) dumps the full environment for anything
      # docker/podman/container-runtime-related.
      - name: Start broker diagnostics watcher (${{ matrix.sample }})
        if: matrix.sample == 'kafka-mtls'
        run: |
          mkdir -p diag
          {
            echo "=== runtime identity ==="
            command -v docker podman
            docker --version; podman --version
            echo "-- readlink docker --"; readlink -f "$(command -v docker)" || true
            echo "-- docker info (runtime hints) --"; docker info 2>&1 | grep -i -E 'podman|server version|operating system' || true
            echo "-- podman info (rootless/userns) --"; podman info 2>&1 | grep -i -E 'rootless|graphDriverName|idmappings' || true
            echo "-- environment (docker/podman/container-related) --"
            env | grep -i -E 'docker|podman|container|dcp' | sort || true
          } > diag/runtime-identity.log 2>&1
          cat diag/runtime-identity.log

          # Continuous, unfiltered lifecycle event streams — catches a
          # container that lives for less than one polling interval, which a
          # `ps -a` snapshot loop cannot.
          nohup podman events --format '{{.Time}} podman {{.Status}} {{.Type}} {{.Name}} {{.ID}}' > diag/podman-events.log 2>&1 &
          disown
          nohup docker events --format '{{.Time}} docker {{.Status}} {{.Type}} {{.Actor.Attributes.name}} {{.ID}}' > diag/docker-events.log 2>&1 &
          disown

          # Unfiltered ps -a snapshots, both runtimes, every second — a
          # container present for at least ~1s should show up here even if
          # events formatting above turns out to need adjustment.
          nohup bash -c '
            for i in $(seq 1 150); do
              {
                echo "=== $(date -u +%H:%M:%S.%N) podman ps -a ==="
                podman ps -a --format "{{.ID}} {{.Names}} {{.Status}} {{.Image}}" 2>&1
                echo "=== $(date -u +%H:%M:%S.%N) docker ps -a ==="
                docker ps -a --format "{{.ID}} {{.Names}} {{.Status}} {{.Image}}" 2>&1
              } >> diag/ps-poll.log 2>&1
              sleep 1
            done
          ' > diag/ps-poll-stdout.log 2>&1 &
          disown
          echo "[watcher] event streams + ps-poll launched"

      # Aspire.Hosting.Dcp is NOT filtered by HeadlessTopology (only
      # Microsoft.Extensions.Diagnostics.HealthChecks and
      # Aspire.Hosting.DistributedApplication are), so it already logs at
      # Information — these env vars ask the default .NET
      # EnvironmentVariablesConfigurationProvider for Debug on top of that,
      # in case DCP's own container-creation reasoning is only logged there.
      - name: Run sample suite (${{ matrix.sample }})
        env:
          Logging__LogLevel__Aspire.Hosting.Dcp: ${{ matrix.sample == 'kafka-mtls' && 'Debug' || '' }}
          Logging__LogLevel__Aspire.Hosting: ${{ matrix.sample == 'kafka-mtls' && 'Debug' || '' }}
        run: bash scripts/run-sample.sh ${{ matrix.sample }}

      # DIAGNOSTIC SCAFFOLDING (temporary — kafka-mtls CI investigation).
      # Prints everything the watcher above captured, regardless of outcome —
      # this is the artefact the failure-only step below cannot produce
      # because teardown has already run by the time it executes.
      - name: Dump broker diagnostics (${{ matrix.sample }})
        if: always() && matrix.sample == 'kafka-mtls'
        run: |
          sleep 3
          echo "===== diag/runtime-identity.log ====="
          cat diag/runtime-identity.log 2>&1 || true
          echo "===== diag/podman-events.log ====="
          cat diag/podman-events.log 2>&1 || true
          echo "===== diag/docker-events.log ====="
          cat diag/docker-events.log 2>&1 || true
          echo "===== diag/ps-poll.log (last 60 lines) ====="
          tail -n 60 diag/ps-poll.log 2>&1 || true
          echo "===== /tmp/aspire-dcp* (DCP's own working directory, if it wrote logs) ====="
          for d in /tmp/aspire-dcp*; do
            [ -e "$d" ] || continue
            echo "--- $d ---"
            find "$d" -type f 2>&1 | while read -r f; do
              echo "-- file: $f --"
              # DCP's kubeconfig/socket files can be large or binary; cap what
              # we dump so a huge file cannot blow the job log.
              head -c 20000 "$f" 2>&1
              echo
            done
          done
          echo "===== podman ps -a (post-run) ====="
          podman ps -a 2>&1 || true
          echo "===== docker ps -a (post-run, for comparison) ====="
          docker ps -a 2>&1 || true

      # A suite that fails because a CONTAINER never became healthy leaves no
      # trace in this log: the engine reports "resource X failed to start" and
      # the container's own stdout — which says why — is never surfaced. That
      # cost a full debugging cycle on the kafka-mtls sample, where the broker
      # was measured healthy in 6.4s under `docker run` with identical inputs
      # and the orchestrated one never came up. Containers are usually torn
      # down by then; anything still present is worth reading.
      - name: Container diagnostics (${{ matrix.sample }})
        if: failure()
        run: |
          echo "=== containers (any state) ==="
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
          for c in $(docker ps -aq); do
            echo "=== logs: $(docker inspect --format '{{.Name}}' "$c") ==="
            docker logs --tail 200 "$c" 2>&1 || true
          done

      - name: Upload reports (${{ matrix.sample }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-${{ matrix.sample }}
          path: out/
          if-no-files-found: warn

  migrations:
    name: migrations
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # More headroom than the sample matrix jobs: this is the heaviest job in the
    # workflow — the engine build plus two source-project compile checks plus THREE
    # sequential DCP topology suites (only the first pays the image pulls). Local
    # wall-clock is ~1.5 min for the suites alone; 30 minutes covers a cold CI runner
    # without masking a genuinely hung suite.
    timeout-minutes: 30

    steps:
      - name: Checkout vouchfx-samples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK (reads global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Bootstrap engine CLI (pinned commit)
        run: bash scripts/bootstrap.sh

      # Compile-check the two "before" test projects being ported — proves the hand-rolled
      # source code in migrations/from-xunit and migrations/from-specflow is genuine,
      # working C#, not a strawman. Neither project is executed here: both require a live
      # stack this workflow does not stand up for them — see each migration's own README.
      - name: Compile-check migrations/from-xunit source
        run: dotnet build migrations/from-xunit/source/OrdersApi.IntegrationTests -c Release

      - name: Compile-check migrations/from-specflow source
        run: dotnet build migrations/from-specflow/source/Orders.Specs -c Release

      - name: Run migration suites (migrations/*/ported)
        run: bash scripts/run-migrations.sh

      - name: Upload reports (migrations)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-migrations
          path: out/
          if-no-files-found: warn
