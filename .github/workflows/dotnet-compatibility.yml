# The net8.0 compatibility baseline must build and execute without a .NET 8
# installation on the .NET 9 and 10 lanes. The existing CI retains Docker and
# release checks; this matrix exercises the source and Docker-free runtime paths.
name: .NET compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: .NET ${{ matrix.dotnet }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dotnet: ['8.0', '9.0', '10.0']
    env:
      DOTNET_MULTILEVEL_LOOKUP: '0'
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A fresh directory prevents preinstalled SDKs/runtimes from satisfying
      # global.json or a net8.0 testhost on a newer-runtime lane.
      - name: Configure isolated SDK installation
        run: printf 'DOTNET_INSTALL_DIR=%s/dotnet-compatibility\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install isolated .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ matrix.dotnet }}.x

      - name: Test runtime-isolation guard safety
        shell: pwsh
        run: ./scripts/ci/test-select-dotnet-runtime.ps1
      - name: Keep only the selected SDK and shared frameworks
        env:
          EXPECTED_DOTNET: '${{ matrix.dotnet }}'
        shell: pwsh
        run: ./scripts/ci/select-dotnet-runtime.ps1 -ExpectedDotnet $env:EXPECTED_DOTNET

      - name: Require the selected SDK and runtime only
        env:
          EXPECTED_DOTNET: ${{ matrix.dotnet }}
        run: |
          set -euo pipefail
          test "$(dirname "$(command -v dotnet)")" = "$DOTNET_INSTALL_DIR"
          sdk="$(dotnet --version)"
          [[ "$sdk" == "$EXPECTED_DOTNET".* ]]
          runtimes="$(dotnet --list-runtimes)"
          printf '%s\n' "$sdk" "$runtimes"
          [[ "$runtimes" == *Microsoft.NETCore.App* ]]
          [[ "$runtimes" == *Microsoft.AspNetCore.App* ]]
          while read -r _framework version _location; do
            [[ "$version" == "$EXPECTED_DOTNET".* ]]
          done <<< "$runtimes"

      - name: Read exact engine source pin
        id: pin
        run: |
          set -euo pipefail
          commit="$(head -n 1 ENGINE_PIN | tr -d '[:space:]')"
          [[ "$commit" =~ ^[0-9a-fA-F]{40}$ ]]
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      # LedgerRunner references this exact source tree. Bootstrap also requires
      # Docker, so this source-only lane performs the checkout directly.
      - name: Checkout pinned engine source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tomas-rampas/vouchfx
          ref: ${{ steps.pin.outputs.commit }}
          path: .vouchfx-src
          persist-credentials: false

      - name: Verify pinned engine source
        env:
          ENGINE_COMMIT: ${{ steps.pin.outputs.commit }}
        run: test "$(git -C .vouchfx-src rev-parse HEAD)" = "$ENGINE_COMMIT"

      - name: Build .NET samples and migration sources
        run: |
          set -euo pipefail
          dotnet build samples/orders-dotnet/app/Orders.Api.csproj -c Release -warnaserror
          dotnet build samples/ledger-jsonrpc/runner/LedgerRunner.csproj -c Release -warnaserror
          dotnet build migrations/from-xunit/source/OrdersApi.IntegrationTests/OrdersApi.IntegrationTests.csproj -c Release -warnaserror
          dotnet build migrations/from-specflow/source/Orders.Specs/Orders.Specs.csproj -c Release -warnaserror

      # Registry construction loads the same SDK/provider closure used by a run.
      # Full business transactions remain in samples-ci.yml's Docker lanes.
      - name: Launch the custom provider runner
        run: |
          set -euo pipefail
          dotnet samples/ledger-jsonrpc/runner/bin/Release/net8.0/LedgerRunner.dll --list \
            | tee "$RUNNER_TEMP/compatibility-provider-list.txt"
          grep -F 'rpc.json-rpc' "$RUNNER_TEMP/compatibility-provider-list.txt"


      - name: Execute a suite on the selected runtime
        env:
          EXPECTED_DOTNET: ${{ matrix.dotnet }}
        run: |
          set -euo pipefail
          expected_major="${EXPECTED_DOTNET%%.*}"
          suite_dir="$RUNNER_TEMP/compatibility-suite"
          mkdir "$suite_dir"
          cat > "$suite_dir/runtime.e2e.yaml" <<YAML
          metadata:
            name: dotnet-runtime-compatibility
          steps:
            - id: assert-runtime
              type: script.csharp
              code: |
                if (Environment.Version.Major != $expected_major)
                    throw new Exception("Unexpected runtime: " + Environment.Version);
                Console.WriteLine("LEDGER_RUNTIME_MAJOR=" + Environment.Version.Major);
          YAML
          dotnet samples/ledger-jsonrpc/runner/bin/Release/net8.0/LedgerRunner.dll \
            "$suite_dir" --junit "$RUNNER_TEMP/compatibility-junit.xml" \
            | tee "$RUNNER_TEMP/compatibility-runtime.log"
          grep -F "LEDGER_RUNTIME_MAJOR=$expected_major" "$RUNNER_TEMP/compatibility-runtime.log"
          python3 - "$RUNNER_TEMP/compatibility-junit.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          cases = root.findall(".//testcase")
          assert len(cases) == 1, len(cases)
          assert not root.findall(".//failure")
          assert not root.findall(".//error")
          assert not root.findall(".//skipped")
          PY
